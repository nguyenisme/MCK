<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           minimum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover">
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>MCK Music</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="dark">
  <div class="page-shell support-page">
    <header class="support-mobile-bar">
  <a class="brand support-brand" href="index.html" aria-label="MCK Music">
    <span class="brand-mark">M</span>
    <span><strong>MCK</strong><small>MUSIC</small></span>
  </a>

  <a
    class="support-back"
    href="index.html"
    aria-label="Quay lại trang chính"
  >
    ←
  </a>
</header>

    <main class="support-card">
      <div class="support-icon" aria-hidden="true">♡</div>

      <p class="support-message">
        Bạn nào nghe hay có thể ủng hộ mình một phần kinh phí nho nhỏ ạ
      </p>

      <div class="bank-information">
        <div class="bank-row">
          <span class="bank-label">Ngân hàng</span>
          <strong id="bankName">MB BANK</strong>
        </div>

        <div class="bank-row">
          <span class="bank-label">Số tài khoản</span>
          <div class="bank-value-with-button">
            <strong id="accountNumber">0001830199459</strong>
            <button class="copy-button" type="button" data-copy-target="accountNumber" data-copy-label="số tài khoản">Sao chép</button>
          </div>
        </div>

        <div class="bank-row">
          <span class="bank-label">Chủ tài khoản</span>
          <strong id="accountName">NGUYEN KHAC NGUYEN</strong>
        </div>

        <div class="bank-row">
          <span class="bank-label">Số điện thoại</span>
          <div class="bank-value-with-button">
            <strong id="phoneNumber"><a href="tel:0969857822">0969 857 822</a></strong>
            <button class="copy-button" type="button" data-copy-target="phoneNumber" data-copy-value="0969857822" data-copy-label="số điện thoại">Sao chép</button>
          </div>
        </div>
      </div>

      <p id="copyNotice" class="copy-notice" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const copyNotice = document.getElementById("copyNotice");

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      textarea.style.pointerEvents = "none";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);
      const successful = document.execCommand("copy");
      document.body.removeChild(textarea);
      if (!successful) throw new Error("Copy failed");
    }

    document.querySelectorAll("[data-copy-target]").forEach((button) => {
      button.addEventListener("click", async () => {
        const target = document.getElementById(button.dataset.copyTarget);
        const label = button.dataset.copyLabel || "thông tin";
        const text = button.dataset.copyValue || target.textContent.trim();

        try {
          await copyText(text);
          copyNotice.textContent = `Đã sao chép ${label}.`;
        } catch {
          copyNotice.textContent = `Không thể tự động sao chép ${label}. Hãy nhấn giữ để sao chép.`;
        }

        setTimeout(() => {
          copyNotice.textContent = "";
        }, 2500);
      });
    });
  </script>
</body>
</html>
