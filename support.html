<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7fbff" />
  <title>Ủng hộ tôi - Fresh Music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <div class="page-shell support-page">
    <header class="header">
      <div>
        <span class="brand-badge">MCK MUSIC</span>
        <h1>Ủng hộ tôi</h1>
        <p>Cảm ơn bạn đã ghé nghe nhạc.</p>
      </div>

      <div class="header-actions">
        <a class="support-link back-link" href="index.html">← Nghe nhạc</a>
        <button id="themeButton" class="round-button" type="button" aria-label="Đổi giao diện">☀</button>
      </div>
    </header>

    <main class="support-card">
      <div class="support-icon" aria-hidden="true">♡</div>

      <p class="support-message">
        Bạn nào nghe hay có thể ủng hộ mình một phần kinh phí nho nhỏ ạ
      </p>

      <div class="bank-information">
        <div class="bank-row">
          <span class="bank-label">Ngân hàng</span>
          <strong id="bankName">MB BANK</strong>
        </div>

        <div class="bank-row">
          <span class="bank-label">Số tài khoản</span>
          <div class="bank-value-with-button">
            <strong id="accountNumber">0001830199459</strong>
            <button id="copyAccountButton" class="copy-button" type="button">Sao chép</button>
          </div>
        </div>

        <div class="bank-row">
          <span class="bank-label">Chủ tài khoản</span>
          <strong id="accountName">NGUYEN KHAC NGUYEN</strong>
        </div>
      </div>

      <p id="copyNotice" class="copy-notice" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const THEME_KEY = "freshMusicTheme";
    const themeButton = document.getElementById("themeButton");
    const copyButton = document.getElementById("copyAccountButton");
    const accountNumber = document.getElementById("accountNumber");
    const copyNotice = document.getElementById("copyNotice");

    function applyTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      const dark = saved === null ? true : saved === "dark";
      document.body.classList.toggle("dark", dark);
      themeButton.textContent = dark ? "☾" : "☀";
    }

    themeButton.addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark");
      document.body.classList.toggle("dark", dark);
      localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
      themeButton.textContent = dark ? "☾" : "☀";
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(accountNumber.textContent.trim());
        copyNotice.textContent = "Đã sao chép số tài khoản.";
      } catch {
        copyNotice.textContent = "Không thể tự động sao chép. Bạn hãy nhấn giữ số tài khoản để sao chép.";
      }
      setTimeout(() => copyNotice.textContent = "", 2500);
    });

    applyTheme();
  </script>
</body>
</html>
