<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7fbff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>MCK Music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="header">
      <div>
        <span class="brand-badge">MCK</span>
        
      </div>
      <div class="header-actions">
        <a class="support-link" href="support.html">Ủng hộ tui</a>
        <button id="themeButton" class="round-button" type="button" aria-label="Đổi giao diện">☀</button>
      </div>
    </header>

    <main class="layout">
      <section class="player-card">
        <div class="artwork">
          <div class="artwork-disc">♫</div>
        </div>

        <div class="player-content">
          <span id="playingStatus" class="playing-status">Sẵn sàng phát</span>
          <h2 id="currentTitle">Chọn một bài hát</h2>
          <p id="currentSource">Thư viện nhạc</p>

          <div class="progress-row">
            <span id="currentTime">0:00</span>
            <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1" />
            <span id="duration">0:00</span>
          </div>

          <div class="main-controls">
            <button id="previousButton" class="secondary-control" type="button" aria-label="Bài trước">⏮</button>
            <button id="playButton" class="play-control" type="button" aria-label="Phát">▶</button>
            <button id="nextButton" class="secondary-control" type="button" aria-label="Bài tiếp theo">⏭</button>
          </div>

          <div class="player-options">
            <div class="mode-switch" aria-label="Chế độ phát">
              <button id="sequentialModeButton" class="mode-button active" type="button">Theo lượt</button>
              <button id="shuffleModeButton" class="mode-button" type="button">Ngẫu nhiên</button>
            </div>

            <div class="volume-control">
              <span>🔉</span>
              <input id="volumeBar" type="range" min="0" max="1" value="0.85" step="0.01" />
            </div>
          </div>
        </div>
      </section>

      <aside class="playlist-panel">
        <div class="panel-header">
          <div>
            <span class="section-label">PLAYLIST</span>
            <h2>Danh sách của tôi</h2>
          </div>
          <button id="createPlaylistButton" class="primary-button" type="button">+ Tạo playlist</button>
        </div>

        <div id="playlistTabs" class="playlist-tabs"></div>

        <div class="playlist-actions">
          <button id="playPlaylistButton" class="ghost-button" type="button">▶ Phát playlist</button>
          <button id="renamePlaylistButton" class="ghost-button" type="button">Đổi tên</button>
          <button id="deletePlaylistButton" class="ghost-button danger" type="button">Xóa</button>
        </div>

        <div id="playlistSongs" class="playlist-list empty-state">
          Chưa có bài hát trong playlist này.
        </div>
      </aside>

      <section class="library-panel">
        <div class="panel-header">
          <div>
            <span class="section-label">THƯ VIỆN</span>
            <h2>30 bài hát</h2>
          </div>
          <button id="playAllButton" class="primary-button" type="button">▶ Phát tất cả</button>
        </div>

        <div id="librarySongs" class="song-list"></div>
      </section>
    </main>
  </div>

  <dialog id="playlistDialog" class="playlist-dialog">
    <form method="dialog" id="playlistForm">
      <h2 id="dialogTitle">Tạo playlist mới</h2>
      <label for="playlistNameInput">Tên playlist</label>
      <input id="playlistNameInput" maxlength="40" placeholder="Ví dụ: Nhạc chill" autocomplete="off" />
      <div class="dialog-actions">
        <button class="ghost-button" value="cancel" type="button" id="cancelDialogButton">Hủy</button>
        <button class="primary-button" value="default" type="submit">Lưu</button>
      </div>
    </form>
  </dialog>

  <audio id="audioPlayer" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
